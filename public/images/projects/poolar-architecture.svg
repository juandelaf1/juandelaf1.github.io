<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320" role="img" aria-labelledby="t d">
  <title id="t">Poolar — high-level architecture (prototype)</title>
  <desc id="d">React/Vite UI calls FastAPI; services apply HITL governance and fail-closed policies; SQLAlchemy/Alembic persist state and audit to database; handlers resume governed actions.</desc>
  <defs>
    <style>
      .box{fill:#111827;stroke:#374151;stroke-width:1.5;rx:10;ry:10}
      .label{fill:#e5e7eb;font:600 14px system-ui, -apple-system, Segoe UI, sans-serif}
      .sub{fill:#9ca3af;font:12px ui-monospace, SFMono-Regular, Menlo, monospace}
      .arrow{stroke:#6b7280;stroke-width:1.5;fill:none;marker-end:url(#a)}
      .note{fill:#9ca3af;font:11px system-ui, sans-serif}
    </style>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="960" height="320" fill="#0b1020"/>
  <rect class="box" x="30" y="110" width="170" height="100"/>
  <text class="label" x="115" y="150" text-anchor="middle">Web UI</text>
  <text class="sub" x="115" y="172" text-anchor="middle">React + Vite + TS</text>
  <text class="sub" x="115" y="190" text-anchor="middle">(thin client / MVP)</text>

  <rect class="box" x="270" y="70" width="220" height="180"/>
  <text class="label" x="380" y="105" text-anchor="middle">API &amp; governance core</text>
  <text class="sub" x="380" y="128" text-anchor="middle">FastAPI · auth/context</text>
  <text class="sub" x="380" y="148" text-anchor="middle">HITL approvals (fail-closed)</text>
  <text class="sub" x="380" y="168" text-anchor="middle">tenant scoping · idempotency</text>
  <text class="sub" x="380" y="188" text-anchor="middle">atomic resume (lock→commit)</text>
  <text class="sub" x="380" y="208" text-anchor="middle">services / domain handlers</text>
  <text class="sub" x="380" y="228" text-anchor="middle">synthetic_pilot only</text>

  <rect class="box" x="560" y="110" width="170" height="100"/>
  <text class="label" x="645" y="148" text-anchor="middle">Data &amp; audit</text>
  <text class="sub" x="645" y="170" text-anchor="middle">SQLAlchemy + Alembic</text>
  <text class="sub" x="645" y="188" text-anchor="middle">state + sanitized events</text>

  <rect class="box" x="780" y="110" width="150" height="100"/>
  <text class="label" x="855" y="150" text-anchor="middle">Database</text>
  <text class="sub" x="855" y="172" text-anchor="middle">SQLite / PostgreSQL</text>
  <text class="sub" x="855" y="190" text-anchor="middle">(PG concurrency tested)</text>

  <path class="arrow" d="M200,160 L270,160"/>
  <path class="arrow" d="M490,160 L560,160"/>
  <path class="arrow" d="M730,160 L780,160"/>
  <text class="note" x="480" y="290" text-anchor="middle">Prototype (v0.6-mvp, development) — not production; Fase 0 in progress. Architecture reflects audited repo state.</text>
</svg>
